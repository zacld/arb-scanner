<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Liquidity</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; margin-bottom: 0; }
  .sub { color: #888; margin-top: 4px; margin-bottom: 16px; }
  select, input { padding: 8px; border-radius: 6px; border: 1px solid #8886; background: transparent; color: inherit; font-family: inherit; }
  section { border: 1px solid #8883; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  section h2 { font-size: 1rem; margin: 0 0 10px 0; }
  .status { padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; }
  .status.ok { background: #2ecc7122; border: 1px solid #2ecc71; }
  .status.unavailable { background: #8881; color: #888; }
  code { font-size: 0.85em; word-break: break-all; }
  .empty { color: #888; text-align: center; padding: 40px 0; }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-top: 8px; }
  form.inline > div { display: flex; flex-direction: column; gap: 4px; }
  form.inline label { font-size: 0.8rem; color: #888; }
  button { padding: 8px 14px; border-radius: 6px; border: none; background: #6c5ce7; color: white; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .preview { font-family: ui-monospace, monospace; font-size: 0.85rem; white-space: pre-wrap; background: #8881; padding: 12px; border-radius: 8px; margin-top: 8px; }
  .msg { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 0.85em; word-break: break-all; }
  .msg.ok { background: #2ecc7122; border: 1px solid #2ecc71; }
  .msg.err { background: #e7404022; border: 1px solid #e74040; }
</style>
</head>
<body>
  <script src="nav.js"></script>
  <h1>💧 Liquidity</h1>
  <div class="sub">Pool verification, route status, and the Funding wallet's real market buy.</div>

  <div><select id="projectSelect"></select></div>
  <div id="app"></div>

<script>
  const params = new URLSearchParams(location.search);
  let currentProjectId = params.get("project") || null;

  async function api(path, opts) {
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  async function loadProjects() {
    const { projects } = await api("/api/projects");
    const select = document.getElementById("projectSelect");
    if (projects.length === 0) {
      document.getElementById("app").innerHTML = `<div class="empty">No coins launched yet. <a href="index.html">Launch one →</a></div>`;
      select.style.display = "none";
      return;
    }
    select.style.display = "";
    select.innerHTML = projects.map((p) => `<option value="${p.id}">${p.name} (${p.symbol}) — ${p.network}</option>`).join("");
    if (!currentProjectId || !projects.find((p) => p.id === currentProjectId)) currentProjectId = projects[0].id;
    select.value = currentProjectId;
    select.addEventListener("change", () => { currentProjectId = select.value; render(); });
    await render();
  }

  async function render() {
    const app = document.getElementById("app");
    app.innerHTML = `<div class="empty">Loading…</div>`;
    try {
      const [{ project, wallets }, stateData] = await Promise.all([
        api(`/api/projects/${currentProjectId}`),
        api(`/api/projects/${currentProjectId}/state`),
      ]);
      const m = stateData.milestones;
      const funding = wallets.find((w) => w.role === "funding");
      const mainHolding = wallets.find((w) => w.role === "main_holding");
      const operators = wallets.filter((w) => w.role === "operator");

      let fundingSol = null;
      if (funding) {
        try {
          const bal = await api(`/api/console/projects/${currentProjectId}/wallets/${funding.id}/balance`);
          fundingSol = bal.sol;
        } catch { /* shown as unknown below */ }
      }

      const reserveSol = project.funding_reserve_sol;
      const swapPercent = project.funding_swap_percent;
      const available = fundingSol != null ? Math.max(0, (fundingSol - reserveSol)) * (swapPercent / 100) : null;

      app.innerHTML = `
        <section>
          <h2>Supply</h2>
          <div>Mint: <code>${project.mint_address || "not minted yet"}</code></div>
          <div>Total supply: ${project.supply ? Number(project.supply).toLocaleString() : "—"} ${project.symbol}</div>
        </section>

        <section>
          <h2>Pool</h2>
          <div class="status ${m.LIQUIDITY_CREATED.reached ? "ok" : "unavailable"}">
            ${m.LIQUIDITY_CREATED.reached
              ? `✅ Verified pool: <code>${project.pool_address}</code> (${new Date(project.pool_verified_at).toLocaleString()})`
              : (m.LIQUIDITY_CREATED.note || "No verified pool yet.")}
          </div>
          <form class="inline" id="poolForm">
            <div>
              <label>Pool address (create it on Raydium first)</label>
              <input name="poolAddress" placeholder="pool account address" style="min-width:320px;" value="${project.pool_address || ""}" />
            </div>
            <button type="submit">Verify pool</button>
          </form>
          <div id="poolMsg"></div>
          <div style="margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;font-size:0.85rem;">
            <a href="https://raydium.io/liquidity/create-pool/?input=${project.mint_address || ""}" target="_blank" rel="noopener">Create pool on Raydium →</a>
            ${project.pool_address ? `<a href="https://raydium.io/liquidity/increase/?mode=remove&pool_id=${project.pool_address}" target="_blank" rel="noopener">Manage / remove liquidity on Raydium →</a>` : ""}
          </div>
          <div style="margin-top:8px;font-size:0.8rem;color:#888;">
            LP tokens stay in your own wallet — nothing here locks them. If this launch doesn't get traction,
            removing liquidity on Raydium (the link above once a pool's verified) returns your share of the pool
            directly to your wallet. That's your proportional share of the pool <em>as it stands</em>, not a
            guaranteed refund of your original deposit — normal LP mechanics, not something any tool can remove.
          </div>
        </section>

        <section>
          <h2>Route</h2>
          <div class="status ${m.ROUTE_CONFIRMED.reached ? "ok" : "unavailable"}">
            ${m.ROUTE_CONFIRMED.reached ? "✅ Jupiter currently returns a live quote for this token." : (m.ROUTE_CONFIRMED.note || "No route checked.")}
          </div>
        </section>

        <section>
          <h2>Funding preview</h2>
          <form class="inline" id="configForm">
            <div><label>Slippage (bps)</label><input name="slippageBps" type="number" value="${project.swap_slippage_bps}" style="width:80px;" /></div>
            <div><label>Reserve for fees (SOL)</label><input name="reserveSol" type="number" step="any" value="${project.funding_reserve_sol}" style="width:100px;" /></div>
            <div><label>% of available to swap</label><input name="swapPercent" type="number" value="${project.funding_swap_percent}" style="width:80px;" /></div>
            <button type="submit">Save</button>
          </form>
          <div class="preview">Funding Wallet
${funding ? "  " + funding.address : "  (not created yet)"}

Received:
  ${fundingSol != null ? fundingSol + " SOL" : "unknown (balance check failed)"}

Reserved for network/launch costs:
  ${reserveSol} SOL

Available for swap (${swapPercent}% of the rest):
  ${available != null ? available.toFixed(6) + " SOL" : "—"}

Swap:
  ${available != null ? available.toFixed(6) : "?"} SOL → estimated ${project.symbol} (real quote fetched when you run the swap)

Destination:
  Main Holding wallet${mainHolding ? " (" + mainHolding.address.slice(0, 8) + "…)" : ""}

Distribution:
${operators.length ? operators.map((o) => `  ${o.label} → ${o.allocation_percent}%`).join("\n") : "  (no operator wallets configured)"}</div>
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
            <button id="swapBtn" ${m.ROUTE_CONFIRMED.reached ? "" : "disabled"}>Run funding swap</button>
            <button id="forwardBtn" ${m.FUNDING_SWAP_COMPLETE.reached ? "" : "disabled"}>Forward to Main Holding</button>
          </div>
          ${!m.ROUTE_CONFIRMED.reached ? `<div class="hint" style="color:#888;font-size:0.8rem;margin-top:6px;">Swap is disabled until a real route is confirmed above — this tool never submits a transaction expected to fail.</div>` : ""}
          <div id="actionMsg"></div>
        </section>
      `;

      document.getElementById("poolForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("poolMsg");
        const poolAddress = new FormData(e.target).get("poolAddress");
        msg.innerHTML = "Verifying…";
        try {
          const result = await api(`/api/projects/${currentProjectId}/liquidity/verify-pool`, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ poolAddress }),
          });
          msg.innerHTML = result.verified
            ? `<div class="msg ok">✅ Verified (${result.program}).</div>`
            : `<div class="msg err">❌ ${result.reason}</div>`;
          if (result.verified) render();
        } catch (err) {
          msg.innerHTML = `<div class="msg err">❌ ${err.message}</div>`;
        }
      });

      document.getElementById("configForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          await api(`/api/projects/${currentProjectId}/liquidity/config`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ slippageBps: Number(fd.get("slippageBps")), reserveSol: Number(fd.get("reserveSol")), swapPercent: Number(fd.get("swapPercent")) }),
          });
          render();
        } catch (err) {
          document.getElementById("actionMsg").innerHTML = `<div class="msg err">❌ ${err.message}</div>`;
        }
      });

      document.getElementById("swapBtn").addEventListener("click", async () => {
        const btn = document.getElementById("swapBtn");
        const msg = document.getElementById("actionMsg");
        btn.disabled = true;
        msg.innerHTML = "Running funding swap…";
        try {
          const result = await api(`/api/projects/${currentProjectId}/funding-swap`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
          msg.innerHTML = `<div class="msg ${result.status === "confirmed" ? "ok" : "err"}">${result.status === "confirmed" ? "✅" : "⚠️"} Swap ${result.status}. ${result.signature ? "Signature: " + result.signature : ""}</div>`;
          render();
        } catch (err) {
          msg.innerHTML = `<div class="msg err">❌ ${err.message}</div>`;
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById("forwardBtn").addEventListener("click", async () => {
        const btn = document.getElementById("forwardBtn");
        const msg = document.getElementById("actionMsg");
        btn.disabled = true;
        msg.innerHTML = "Forwarding to Main Holding…";
        try {
          const result = await api(`/api/projects/${currentProjectId}/funding-forward`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
          msg.innerHTML = `<div class="msg ${result.status === "confirmed" ? "ok" : "err"}">${result.status === "confirmed" ? "✅" : "⚠️"} Forward ${result.status}. ${result.signature ? "Signature: " + result.signature : ""}</div>`;
          render();
        } catch (err) {
          msg.innerHTML = `<div class="msg err">❌ ${err.message}</div>`;
        } finally {
          btn.disabled = false;
        }
      });
    } catch (err) {
      app.innerHTML = `<div class="status unavailable">${err.message}</div>`;
    }
  }

  loadProjects().catch((err) => {
    document.getElementById("app").innerHTML = `<div class="status unavailable">${err.message}</div>`;
  });
</script>
</body>
</html>
