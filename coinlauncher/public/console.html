<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wallet Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; margin-bottom: 0; }
  .sub { color: #888; margin-top: 4px; margin-bottom: 16px; }
  select { padding: 8px; border-radius: 6px; border: 1px solid #8886; background: transparent; color: inherit; font-family: inherit; }
  .banner { background: #f39c1222; border: 1px solid #f39c12; border-radius: 8px; padding: 12px; margin: 16px 0; font-size: 0.88rem; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0; border-bottom: 1px solid #8883; padding-bottom: 8px; }
  .tab { padding: 8px 14px; border-radius: 8px 8px 0 0; border: 1px solid #8886; border-bottom: none; background: transparent; color: inherit; cursor: pointer; font-size: 0.9rem; }
  .tab.active { background: #6c5ce7; border-color: #6c5ce7; color: white; font-weight: 600; }
  .panel { display: none; }
  .panel.active { display: block; }
  section { border: 1px solid #8883; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  section h2 { font-size: 1rem; margin: 0 0 10px 0; }
  .addrRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  code.addr { font-size: 0.85em; word-break: break-all; background: #8881; padding: 2px 6px; border-radius: 4px; }
  button { padding: 8px 14px; border-radius: 6px; border: none; background: #6c5ce7; color: white; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
  button.secondary { background: transparent; border: 1px solid #8886; color: inherit; font-weight: normal; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .balances { display: flex; gap: 24px; margin: 10px 0; }
  .balances .stat b { display: block; font-size: 1.2rem; }
  .balances .stat span { color: #888; font-size: 0.8rem; }
  img.qr { width: 140px; height: 140px; border-radius: 8px; margin: 10px 0; background: white; padding: 6px; }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-top: 8px; }
  form.inline > div { display: flex; flex-direction: column; gap: 4px; }
  form.inline label { font-size: 0.8rem; color: #888; }
  form.inline input, form.inline select { padding: 7px; border-radius: 6px; border: 1px solid #8886; background: transparent; color: inherit; font-family: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #8882; }
  .ok { color: #2ecc71; }
  .fail { color: #e74040; }
  .msg { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 0.85em; word-break: break-all; }
  .msg.ok { background: #2ecc7122; border: 1px solid #2ecc71; }
  .msg.err { background: #e7404022; border: 1px solid #e74040; }
  .empty { color: #888; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
  <h1>🔑 Wallet Console</h1>
  <div class="sub">Every wallet shown here is created and controlled by whoever ran the launch — not independent holders.</div>

  <div>
    <select id="launchSelect"></select>
  </div>

  <div id="app"></div>

<script>
  const params = new URLSearchParams(location.search);
  let currentLaunch = null; // manifest
  let currentLaunchId = params.get("launch") || null;
  let currentWalletId = "owner";

  async function api(path, opts) {
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  function fmt(n, decimals = 4) {
    const num = Number(n);
    return Number.isFinite(num) ? num.toLocaleString(undefined, { maximumFractionDigits: decimals }) : n;
  }

  async function loadLaunches() {
    const { launches } = await api("/api/console/launches");
    const select = document.getElementById("launchSelect");
    if (launches.length === 0) {
      document.getElementById("app").innerHTML = `<div class="empty">No coins launched yet. Launch one from the main dashboard first.</div>`;
      select.style.display = "none";
      return;
    }
    select.style.display = "";
    select.innerHTML = launches
      .map((l) => `<option value="${l.id}">${l.name} (${l.symbol}) — ${l.network} — ${l.walletCount} wallets</option>`)
      .join("");
    if (!currentLaunchId || !launches.find((l) => l.id === currentLaunchId)) {
      currentLaunchId = launches[0].id;
    }
    select.value = currentLaunchId;
    select.addEventListener("change", () => {
      currentLaunchId = select.value;
      currentWalletId = "owner";
      loadLaunch();
    });
    await loadLaunch();
  }

  async function loadLaunch() {
    const { manifest } = await api(`/api/console/launches/${currentLaunchId}`);
    currentLaunch = manifest;
    renderShell();
  }

  function allWallets() {
    return [
      { id: "owner", label: currentLaunch.ownerWallet.label || "Owner", address: currentLaunch.ownerWallet.address },
      ...(currentLaunch.operatorWallets || []).map((w) => ({ id: w.id, label: w.label, address: w.address, funded: w.funded })),
    ];
  }

  function renderShell() {
    const wallets = allWallets();
    if (!wallets.find((w) => w.id === currentWalletId)) currentWalletId = "owner";

    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="banner">
        ⚠️ <strong>${wallets.length} wallets shown below are all commonly controlled by the same operator</strong>
        (${currentLaunch.name} / ${currentLaunch.symbol} launch) — they are not independent holders, and should be
        identified as such wherever this project is discussed publicly.
      </div>
      <div class="tabs" id="tabs"></div>
      <div id="panels"></div>
    `;

    const tabs = document.getElementById("tabs");
    tabs.innerHTML = wallets
      .map((w) => `<button class="tab ${w.id === currentWalletId ? "active" : ""}" data-wallet="${w.id}">${w.label}</button>`)
      .join("");
    tabs.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentWalletId = btn.dataset.wallet;
        renderShell();
      });
    });

    const panels = document.getElementById("panels");
    panels.innerHTML = `<div class="panel active" id="panel-${currentWalletId}"></div>`;
    renderWalletPanel(currentWalletId);
  }

  function renderWalletPanel(walletId) {
    const wallet = allWallets().find((w) => w.id === walletId);
    const panel = document.getElementById(`panel-${walletId}`);
    const isMainnet = currentLaunch.network === "mainnet-beta";

    panel.innerHTML = `
      <section>
        <h2>Receive</h2>
        <div class="addrRow">
          <code class="addr">${wallet.address}</code>
          <button class="secondary" id="copyBtn">Copy</button>
        </div>
        <img class="qr" src="/api/console/launches/${currentLaunchId}/wallets/${walletId}/qrcode.png" alt="QR code" />
      </section>

      <section>
        <h2>Balance <button class="secondary" id="refreshBtn" style="float:right;">Refresh</button></h2>
        <div id="balanceBox">Loading…</div>
      </section>

      <section>
        <h2>Send</h2>
        <form class="inline" id="sendForm">
          <div>
            <label>Asset</label>
            <select name="assetType">
              <option value="SOL">SOL</option>
              <option value="TOKEN">${currentLaunch.symbol}</option>
            </select>
          </div>
          <div>
            <label>To address</label>
            <input name="to" required placeholder="recipient address" style="min-width:220px;" />
          </div>
          <div>
            <label>Amount</label>
            <input name="amount" type="number" step="any" required placeholder="0.0" style="width:100px;" />
          </div>
          <button type="submit">Send</button>
        </form>
        <div id="sendMsg"></div>
      </section>

      <section>
        <h2>Swap</h2>
        ${isMainnet ? `
          <form class="inline" id="swapQuoteForm">
            <div>
              <label>Direction</label>
              <select name="direction">
                <option value="SOL_TO_TOKEN">SOL → ${currentLaunch.symbol}</option>
                <option value="TOKEN_TO_SOL">${currentLaunch.symbol} → SOL</option>
              </select>
            </div>
            <div>
              <label>Amount in</label>
              <input name="amount" type="number" step="any" required placeholder="0.0" style="width:100px;" />
            </div>
            <button type="submit">Get quote</button>
          </form>
          <div id="swapQuoteBox"></div>
        ` : `<div class="hint" style="color:#888;">Swap requires mainnet — devnet has no real liquidity to swap against.</div>`}
      </section>

      <section>
        <h2>Transaction history</h2>
        <div id="historyBox">Loading…</div>
      </section>
    `;

    document.getElementById("copyBtn").addEventListener("click", async () => {
      await navigator.clipboard.writeText(wallet.address).catch(() => {});
      const btn = document.getElementById("copyBtn");
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = "Copy"; }, 1200);
    });

    document.getElementById("refreshBtn").addEventListener("click", () => { loadBalance(walletId); loadHistory(walletId); });

    document.getElementById("sendForm").addEventListener("submit", (e) => onSend(e, walletId));

    if (isMainnet) {
      document.getElementById("swapQuoteForm").addEventListener("submit", (e) => onSwapQuote(e, walletId));
    }

    loadBalance(walletId);
    loadHistory(walletId);
  }

  async function loadBalance(walletId) {
    const box = document.getElementById("balanceBox");
    if (!box) return;
    try {
      const data = await api(`/api/console/launches/${currentLaunchId}/wallets/${walletId}/balance`);
      box.innerHTML = `
        <div class="balances">
          <div class="stat"><b>${fmt(data.sol)} SOL</b><span>native balance</span></div>
          <div class="stat"><b>${fmt(data.token.uiAmount)} ${data.token.symbol}</b><span>token balance</span></div>
        </div>
      `;
    } catch (err) {
      box.innerHTML = `<div class="msg err">${err.message}</div>`;
    }
  }

  async function loadHistory(walletId) {
    const box = document.getElementById("historyBox");
    if (!box) return;
    try {
      const data = await api(`/api/console/launches/${currentLaunchId}/wallets/${walletId}/history`);
      if (data.transactions.length === 0) {
        box.innerHTML = `<div class="hint" style="color:#888;">No transactions yet.</div>`;
        return;
      }
      box.innerHTML = `
        <table>
          <thead><tr><th>Signature</th><th>Status</th><th>When</th><th></th></tr></thead>
          <tbody>
            ${data.transactions.map((t) => `
              <tr>
                <td>${t.signature.slice(0, 12)}…</td>
                <td class="${t.status === "success" ? "ok" : "fail"}">${t.status}</td>
                <td>${t.blockTime ? new Date(t.blockTime * 1000).toLocaleString() : "—"}</td>
                <td><a href="${t.explorerUrl}" target="_blank" rel="noopener">view →</a></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    } catch (err) {
      box.innerHTML = `<div class="msg err">${err.message}</div>`;
    }
  }

  async function onSend(e, walletId) {
    e.preventDefault();
    const form = e.target;
    const msgBox = document.getElementById("sendMsg");
    const fd = new FormData(form);
    const payload = { assetType: fd.get("assetType"), to: fd.get("to"), amount: fd.get("amount") };
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true;
    msgBox.innerHTML = "";
    try {
      const data = await api(`/api/console/launches/${currentLaunchId}/wallets/${walletId}/send`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      msgBox.innerHTML = `<div class="msg ok">✅ Sent. <a href="${data.explorerUrl}" target="_blank" rel="noopener">View transaction →</a></div>`;
      form.reset();
      loadBalance(walletId);
      loadHistory(walletId);
    } catch (err) {
      msgBox.innerHTML = `<div class="msg err">❌ ${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  async function onSwapQuote(e, walletId) {
    e.preventDefault();
    const form = e.target;
    const box = document.getElementById("swapQuoteBox");
    const fd = new FormData(form);
    const direction = fd.get("direction");
    const amount = fd.get("amount");
    box.innerHTML = "Fetching quote…";
    try {
      const { quote } = await api(`/api/console/launches/${currentLaunchId}/wallets/${walletId}/swap/quote`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ direction, amount }),
      });
      const outSymbol = direction === "SOL_TO_TOKEN" ? currentLaunch.symbol : "SOL";
      const outDecimals = direction === "SOL_TO_TOKEN" ? currentLaunch.decimals : 9;
      const outAmount = Number(quote.outAmount) / 10 ** outDecimals;
      box.innerHTML = `
        <div class="msg" style="background:#8881;border:1px solid #8886;">
          Estimated out: <b>${fmt(outAmount)} ${outSymbol}</b> (price impact ${quote.priceImpactPct ? (Number(quote.priceImpactPct) * 100).toFixed(2) : "?"}%)
          <div style="margin-top:8px;"><button id="confirmSwapBtn">Confirm swap</button></div>
        </div>
      `;
      document.getElementById("confirmSwapBtn").addEventListener("click", async () => {
        box.innerHTML = "Submitting swap…";
        try {
          const result = await api(`/api/console/launches/${currentLaunchId}/wallets/${walletId}/swap/execute`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ quoteResponse: quote }),
          });
          box.innerHTML = `<div class="msg ok">✅ Swapped. <a href="${result.explorerUrl}" target="_blank" rel="noopener">View transaction →</a></div>`;
          loadBalance(walletId);
          loadHistory(walletId);
        } catch (err) {
          box.innerHTML = `<div class="msg err">❌ ${err.message}</div>`;
        }
      });
    } catch (err) {
      box.innerHTML = `<div class="msg err">❌ ${err.message}</div>`;
    }
  }

  loadLaunches().catch((err) => {
    document.getElementById("app").innerHTML = `<div class="msg err">${err.message}</div>`;
  });
</script>
</body>
</html>
