<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Overview</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; margin-bottom: 0; }
  .sub { color: #888; margin-top: 4px; margin-bottom: 16px; }
  select { padding: 8px; border-radius: 6px; border: 1px solid #8886; background: transparent; color: inherit; font-family: inherit; }
  section { border: 1px solid #8883; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  section h2 { font-size: 1rem; margin: 0 0 10px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { border: 1px solid #8883; border-radius: 8px; padding: 10px 12px; }
  .card .label { font-size: 0.75rem; color: #888; }
  .card .value { font-size: 1.1rem; font-weight: 600; word-break: break-all; }
  code { font-size: 0.85em; }
  .ladder { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .step { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; }
  .step .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .step.reached { background: #2ecc7115; }
  .step.reached .dot { background: #2ecc71; }
  .step.unavailable { opacity: 0.5; }
  .step.unavailable .dot { background: #8886; }
  .step.pending .dot { background: #f39c12; }
  .step .note { color: #888; font-size: 0.78rem; margin-left: auto; }
  .kind { font-size: 0.65rem; padding: 1px 6px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  .kind.milestone { background: #3498db22; color: #3498db; }
  .kind.operation { background: #6c5ce722; color: #6c5ce7; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #8882; }
  button { padding: 8px 14px; border-radius: 6px; border: none; background: #6c5ce7; color: white; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 0.85em; word-break: break-all; }
  .msg.ok { background: #2ecc7122; border: 1px solid #2ecc71; }
  .msg.err { background: #e7404022; border: 1px solid #e74040; }
  .empty { color: #888; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
  <script src="nav.js"></script>
  <h1>📊 Overview</h1>
  <div class="sub">Token, wallets, launch progress, and recent activity for one project at a time.</div>

  <div><select id="projectSelect"></select></div>
  <div id="app"></div>

<script>
  const params = new URLSearchParams(location.search);
  let currentProjectId = params.get("project") || null;

  async function api(path, opts) {
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  const ROLE_LABEL = { owner: "Owner", funding: "Funding", main_holding: "Main Holding", operator: "Operator" };

  async function loadProjects() {
    const { projects } = await api("/api/projects");
    const select = document.getElementById("projectSelect");
    if (projects.length === 0) {
      document.getElementById("app").innerHTML = `<div class="empty">No coins launched yet. <a href="index.html">Launch one →</a></div>`;
      select.style.display = "none";
      return;
    }
    select.style.display = "";
    select.innerHTML = projects.map((p) => `<option value="${p.id}">${p.name} (${p.symbol}) — ${p.network}</option>`).join("");
    if (!currentProjectId || !projects.find((p) => p.id === currentProjectId)) currentProjectId = projects[0].id;
    select.value = currentProjectId;
    select.addEventListener("change", () => { currentProjectId = select.value; render(); });
    await render();
  }

  async function render() {
    const app = document.getElementById("app");
    app.innerHTML = `<div class="empty">Loading…</div>`;
    try {
      const [{ project, wallets }, stateData, txData] = await Promise.all([
        api(`/api/projects/${currentProjectId}`),
        api(`/api/projects/${currentProjectId}/state`),
        api(`/api/projects/${currentProjectId}/transactions?limit=15`),
      ]);

      app.innerHTML = `
        <section>
          <h2>Token</h2>
          <div class="grid">
            <div class="card"><div class="label">Name</div><div class="value">${project.name}</div></div>
            <div class="card"><div class="label">Symbol</div><div class="value">${project.symbol}</div></div>
            <div class="card"><div class="label">Network</div><div class="value">${project.network}</div></div>
            <div class="card"><div class="label">Mint address</div><div class="value"><code>${project.mint_address || "not minted"}</code></div></div>
            <div class="card"><div class="label">Decimals</div><div class="value">${project.decimals ?? "—"}</div></div>
            <div class="card"><div class="label">Supply</div><div class="value">${project.supply ? Number(project.supply).toLocaleString() : "—"}</div></div>
          </div>
        </section>

        <section>
          <h2>Wallets <a href="console.html?project=${currentProjectId}" style="font-size:0.8rem;float:right;">Manage →</a></h2>
          <div class="grid" id="walletCards"></div>
        </section>

        <section>
          <h2>Launch progress</h2>
          <div class="ladder" id="ladder"></div>
        </section>

        <section>
          <h2>Distribution <span style="font-size:0.8rem;color:#888;">(Main Holding → Operator wallets)</span></h2>
          <div id="distributeBox"></div>
        </section>

        <section>
          <h2>Recent transactions</h2>
          <div id="txBox"></div>
        </section>
      `;

      const walletCards = document.getElementById("walletCards");
      walletCards.innerHTML = wallets
        .map((w) => `<div class="card"><div class="label">${ROLE_LABEL[w.role] || w.role} — ${w.label}</div><div class="value"><code>${w.address.slice(0, 4)}…${w.address.slice(-4)}</code></div></div>`)
        .join("") || `<div class="empty">No wallets yet.</div>`;

      const ladder = document.getElementById("ladder");
      ladder.innerHTML = stateData.states
        .map((s) => {
          const m = stateData.milestones[s];
          const cls = m.reached ? "reached" : m.mode === "unavailable" ? "unavailable" : "pending";
          const note = m.note || (m.detail && m.detail.error) || "";
          const kindBadge = `<span class="kind ${m.kind}">${m.kind}</span>`;
          return `<div class="step ${cls}"><span class="dot"></span><span>${s}</span>${kindBadge}${note ? `<span class="note">${note}</span>` : ""}</div>`;
        })
        .join("");

      const opWallets = wallets.filter((w) => w.role === "operator");
      const mainHolding = wallets.find((w) => w.role === "main_holding");
      const distributeBox = document.getElementById("distributeBox");
      if (!mainHolding || opWallets.length === 0) {
        distributeBox.innerHTML = `<div class="empty" style="padding:10px 0;">No Main Holding wallet or operator wallets configured for this project.</div>`;
      } else {
        distributeBox.innerHTML = `
          <div style="font-size:0.85rem;color:#888;">
            Distributes Main Holding's real current token balance across ${opWallets.length} operator wallet(s)
            by their configured allocation. Won't re-run a completed distribution unless forced.
          </div>
          <button id="distributeBtn" style="margin-top:8px;">Run distribution</button>
          <div id="distributeMsg"></div>
        `;
        document.getElementById("distributeBtn").addEventListener("click", async () => {
          const btn = document.getElementById("distributeBtn");
          const msg = document.getElementById("distributeMsg");
          btn.disabled = true;
          msg.innerHTML = "Running…";
          try {
            const result = await api(`/api/projects/${currentProjectId}/distribute`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({}),
            });
            const lines = result.results.map((r) => r.ok
              ? `✅ ${r.label}: ${r.resumed ? "already done" : "sent"}${r.signature ? ` (${r.signature.slice(0, 10)}…)` : ""}`
              : `❌ ${r.label}: ${r.error}`
            ).join("<br/>");
            msg.innerHTML = `<div class="msg ${result.complete ? "ok" : "err"}">${result.complete ? "✅ Distribution complete." : "⚠️ Distribution incomplete."}<br/>${lines}</div>`;
            render();
          } catch (err) {
            msg.innerHTML = `<div class="msg err">❌ ${err.message}</div>`;
          } finally {
            btn.disabled = false;
          }
        });
      }

      const txBox = document.getElementById("txBox");
      txBox.innerHTML = txData.transactions.length === 0
        ? `<div class="empty" style="padding:10px 0;">No recorded transactions yet.</div>`
        : `<table>
            <thead><tr><th>Type</th><th>Wallet</th><th>Amount</th><th>Status</th><th>When</th></tr></thead>
            <tbody>
              ${txData.transactions.map((t) => `
                <tr>
                  <td>${t.type}</td>
                  <td>${t.wallet_role || "—"}</td>
                  <td>${t.output_amount || t.input_amount || "—"} ${t.output_asset || t.input_asset || ""}</td>
                  <td>${t.status}</td>
                  <td>${new Date(t.created_at).toLocaleString()}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>`;
    } catch (err) {
      app.innerHTML = `<div class="msg err">${err.message}</div>`;
    }
  }

  loadProjects().catch((err) => {
    document.getElementById("app").innerHTML = `<div class="msg err">${err.message}</div>`;
  });
</script>
</body>
</html>
