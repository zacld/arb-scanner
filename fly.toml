# Fly.io config. See docs/deploy.md for the full walkthrough.
#
# IMPORTANT: set `app` below to the exact name `fly launch` generated for you
# (e.g. arb-scanner-solitary-snow-8410) — `fly secrets`/`fly deploy` read it from
# here. And run ONE machine only (`fly scale count 1`): the SQLite job store +
# scan worker are single-instance, so two machines would split your data.
app = "REPLACE-WITH-YOUR-FLY-APP-NAME"
primary_region = "lhr"   # London — close to the UK retail/eBay endpoints

[build]

[env]
  ARBFINDER_HOSTED = "1"
  ARBFINDER_DATA_DIR = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false      # stay up so the worker + saved results persist
  min_machines_running = 1

# Persistent disk for SQLite jobs DB + latest results.csv.
[mounts]
  source = "arbfinder_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"                   # Chromium is memory-hungry; 2gb avoids OOM
