<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply</title></head>
<body>
<!--
  The classic boards.greenhouse.io form as served inside the embed iframe:
  job_application[...] field names, custom questions as answers_attributes,
  and questions rendered in a sibling div rather than a <label for>.
-->
<div id="main">
  <form id="application_form" enctype="multipart/form-data">
    <div id="first_name_container">
      <label for="first_name">First Name <span class="asterisk">*</span></label>
      <input type="text" id="first_name" name="job_application[first_name]" required>
    </div>
    <div>
      <label for="last_name">Last Name <span class="asterisk">*</span></label>
      <input type="text" id="last_name" name="job_application[last_name]" required>
    </div>
    <div>
      <label for="email">Email <span class="asterisk">*</span></label>
      <input type="email" id="email" name="job_application[email]" required>
    </div>
    <div>
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="job_application[phone]">
    </div>
    <div id="resume_fieldset">
      <label>Resume/CV <span class="asterisk">*</span></label>
      <div id="resume_filename"></div>
      <a class="button" href="#">Attach</a>
      <input type="file" id="resume" name="job_application[resume]" required
             style="visibility:hidden;height:0">
    </div>
    <div class="field">
      <label for="job_application_answers_attributes_0_text_value">
        Website / Portfolio
      </label>
      <input type="url" id="job_application_answers_attributes_0_text_value"
             name="job_application[answers_attributes][0][text_value]">
    </div>
    <div class="field">
      <div class="application-question-label">
        Tell us about a deal you closed that you are proud of. *
      </div>
      <textarea id="job_application_answers_attributes_1_text_value"
                name="job_application[answers_attributes][1][text_value]"
                aria-required="true" maxlength="1500"></textarea>
    </div>
    <div class="field">
      <div class="application-question-label">How did you hear about this role?</div>
      <select id="job_application_answers_attributes_2_answer_selected"
              name="job_application[answers_attributes][2][answer_selected]">
        <option value="">--</option>
        <option value="1">LinkedIn</option>
        <option value="2">Referral</option>
        <option value="3">Company website</option>
        <option value="4">Other</option>
      </select>
    </div>
    <input type="submit" id="submit_app" value="Submit Application">
  </form>
</div>
</body>
</html>
